<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>form pemesanan mie Gacor KUACIW!!!</h1>
   <p>
    silakan isi form dibawah ini untuk memesan mie gacor kuaciw
   </p>

   <form action="#" method="post">
        <fieldset>
            <legend>Informasi Pemesanan</legend>
            <p>
                <label for="costomername">Nama Customer:</label>
                <input type="text" id="costomername" name="costomername" required>
            </p>
            <p>
                <label for="address">Alamat:</label>
                <textarea id="address" name="address" required></textarea>
            </p>
            <p>
                <label for="phone">No. Telepon:</label>
                <input type="tel" id="phone" name="phone" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p> 
            <p>
                <label for="quantity">Jumlah Pesanan:</label>
                <input type="number" id="quantity" name="quantity" min="1" required>
            </p>
            <p>
                <label for="delivery">Metode Pengiriman:</label><br>
                <textarea
                   id="delivery"
                   name="delivery"
                   rows="4"
                   cols="50"
                   maxlength="400"
                   placeholder="Masukkan metode pengiriman yang diinginkan (misalnya: kurir, ojek online, atau ambil sendiri)"
                ></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>design your'e dream pizza</legend>
            <p><strong>Mie Gacor KUACIW</strong></p>
            <p>pilih salah satu</p>

            <p>
                <input type="radio" id="mie-goreng" name="mie" value="mie-goreng">
                <label for="mie-goreng">Mie Goreng</label>

                <input type="radio" id="mie-aceh" name="mie" value="mie-aceh">
                <label for="mie-aceh">Mie Aceh</label>

                <input type="radio" id="mie-gacor" name="mie" value="mie-gacor">
                <label for="mie-gacor">Mie Gacor</label>

                <input type="radio" id="mie-gacor KUACIW" name="mie" value="mie-gacor KUACIW">
                <label for="mie-gacor KUACIW">Mie Gacor KUACIW</label>

            </p>

            <p><strong>toping</strong></p>

            <p>

                <input type="checkbox" id="Telor-ceplok" name="Telor-ceplok" value="Telor-ceplok">
                <label for="Telor-ceplok">Toping 1</label>

                <input type="checkbox" id="Telor-dadar" name="Telor-dadar" value="Telor-dadar">
                <label for="Telor-dadar">Toping 2</label>

                <input type="checkbox" id="Telor-rebus" name="Telor-rebus" value="Telor-rebus">
                <label for="Telor-rebus">Toping 3</label>

                <input type="checkbox" id="sosis" name="sosis" value="sosis">
                <label for="sosis">Toping 4</label>
            </p>
            
            <p>
                <label for="quantity">Jumlah Pesanan:</label>
                <select id="quantity" name="quantity" required>
                    <option value="">Pilih jumlah pesanan</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
        </fieldset>

    
            <a href="hasil.html" class="btn">Lihat Hasil Pemesanan</a>
            
            <button type="reset" value="Reset Form">
                Reset Form
            </button>
        </p>

   </form>
</body>
</html>
